name: Publish Pre-release to npm

# Run on pushes to the main branch
on:
  push:
    branches:
      - main

# Jobs that need more (the publish job) widen this themselves.
permissions:
  contents: read

# One pre-release publish at a time, in push order, so `alpha` never ends up on the
# older of two quick pushes. A run in progress is never cancelled mid-publish; GitHub
# keeps only the newest waiting run.
concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  # E2E runs in the Playwright image, which ships the browsers and their system deps.
  # `playwright install --with-deps` fetched 114MB of WebKit's GStreamer/GTK tree on
  # every run at an Ubuntu mirror speed that swung between 49s and 17min, and dominated
  # this workflow's wall clock. Publishing stays on a plain runner: the image has no
  # `gh` CLI, and the release step needs it.
  # The matrix is a single value so the image tag and the version guard cannot drift.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        playwright: ['1.60.0']
    container: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The image carries browsers for exactly one Playwright version; a dependency bump
      # without a tag bump otherwise fails deep in the run with "Executable doesn't exist".
      - name: Verify Playwright Matches the Container Image
        run: |
          actual=$(node -p "require('@playwright/test/package.json').version")
          if [ "$actual" != "${{ matrix.playwright }}" ]; then
            echo "::error::Playwright is $actual but this job runs in the v${{ matrix.playwright }} image. Bump the matrix value in this workflow."
            exit 1
          fi

      - name: Build Package
        run: npm run build

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          # Actions sets HOME=/github/home, owned by the image's pwuser while the job runs
          # as root. Chromium and WebKit do not care; Firefox refuses to launch.
          HOME: /root

  build-and-publish:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token: write — npm trusted publishing (OIDC), no NPM_TOKEN needed
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org' # Set registry for all npm commands
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
        env:
          CI: true

      - name: Check Test Results
        if: failure()
        run: |
          echo "❌ Tests failed! Cannot proceed with pre-release publication."
          echo "Please fix the failing tests before merging to main branch."
          exit 1

      # Generate pre-release version with timestamp and commit SHA
      - name: Generate Pre-release Version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # A pre-release of a version that is already on npm would sort below it
          # (1.5.0-alpha.x < 1.5.0), so builds made after a stable release are
          # pre-releases of the next patch.
          if [ -n "$(npm view "$PACKAGE_NAME@$BASE_VERSION" version 2>/dev/null || true)" ]; then
            BASE_VERSION=$(node -p "const [major, minor, patch] = process.argv[1].split('.').map(Number); [major, minor, patch + 1].join('.')" "$BASE_VERSION")
          fi
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          # The `g` prefix keeps the identifier valid: an all-digit short SHA with a
          # leading zero is not a legal semver pre-release identifier.
          SHORT_SHA="g$(git rev-parse --short HEAD)"
          PRE_VERSION="${BASE_VERSION}-alpha.${TIMESTAMP}.${SHORT_SHA}"
          echo "Pre-release version: $PRE_VERSION"
          echo "version=$PRE_VERSION" >> $GITHUB_OUTPUT
          # Update package.json with pre-release version
          npm version $PRE_VERSION --no-git-tag-version

      - name: Build Package
        run: npm run build

      - name: Check Build and Test Results
        if: failure()
        run: |
          echo "❌ Build or post-build tests failed!"
          echo "Cannot proceed with pre-release publication."
          exit 1

      # Best Practice: Verify what will be in the package before publishing
      - name: Verify Package Contents
        run: npm pack --dry-run

      # Validate the published package shape: exports map targets must exist
      # (publint) and the shipped types must resolve under every TypeScript
      # moduleResolution mode, including node16/nodenext (attw).
      - name: Validate Package Exports and Types
        # Both tools are pinned devDependencies: this job holds the npm publish
        # token, so it must not fetch whatever `npx` resolves at run time.
        run: npm run check:package

      - name: Publish Pre-release to npm
        # --ignore-scripts: this workflow already ran build + test + test:e2e
        # explicitly above. Without --ignore-scripts the `prepublishOnly`
        # script in package.json would re-run all three, doubling CI time.
        run: npm publish --access public --tag alpha --ignore-scripts

      - name: Report Success
        run: |
          echo "✅ Pre-release published successfully!"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🏷️  Tag: alpha"
          echo "📥 Install with: npm install @vaneui/ui@alpha"